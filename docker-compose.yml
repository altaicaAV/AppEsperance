services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: esperance
      POSTGRES_PASSWORD: esperance
      POSTGRES_DB: esperance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

volumes:
  pgdata: